<script type="text/babel" data-presets="react">
try {

if (!window.React || !window.ReactDOM) {
  throw new Error('React não carregou. Verifique sua conexão com a internet e recarregue a página.');
}
if (!window.supabase) {
  throw new Error('A biblioteca do Supabase não carregou. Verifique sua conexão com a internet e recarregue a página.');
}

const { useState, useEffect, useMemo } = React;

const supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const CARTOES = [
  { id: 'bradesco', nome: 'Bradesco Visa', vencimento: 10, cor: '#CC092F', texto: '#FFFFFF' },
  { id: 'c6', nome: 'C6 Bank', vencimento: 20, cor: '#111111', texto: '#FFDD00' },
  { id: 'mp', nome: 'Mercado Pago', vencimento: 20, cor: '#009EE3', texto: '#FFFFFF' },
  { id: 'amex', nome: 'Amex Platinum', vencimento: 25, cor: '#5C6670', texto: '#F1E7D0' },
  { id: 'viacredi', nome: 'Viacredi', vencimento: 22, cor: '#00A551', texto: '#FFFFFF' },
];

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const TIPOS = {
  entrada: { label: 'Entrada', cor: '#7FB069' },
  conta: { label: 'Conta', cor: '#E0A458' },
  cartao: { label: 'Crédito', cor: '#D9705A' },
  debito: { label: 'Débito', cor: '#5B9BD5' },
  pix: { label: 'Pix', cor: '#32BCAD' },
};
const GRUPO_GASTO = ['cartao', 'debito', 'pix'];

const APELIDOS_CARTAO = {
  bradesco: 'bradesco', visa: 'bradesco',
  c6: 'c6',
  mp: 'mp', mercadopago: 'mp', 'mercado-pago': 'mp',
  amex: 'amex', amexplatinum: 'amex', platinum: 'amex',
  viacredi: 'viacredi',
};

function formatBRL(v) {
  return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function normalizar(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function diasParaVencimento(dia) {
  const hoje = new Date();
  let venc = new Date(hoje.getFullYear(), hoje.getMonth(), dia);
  if (venc < hoje) venc = new Date(hoje.getFullYear(), hoje.getMonth() + 1, dia);
  return Math.ceil((venc - hoje) / 86400000);
}

function parseRapido(texto, contasFixas, bancos) {
  const palavras = texto.trim().split(/\s+/);
  if (!texto.trim()) return null;
  const norm = palavras.map(normalizar);

  const fixaFlag = norm.some(w => w === 'fixa' || w === 'fixo');
  let tipo = null;
  if (fixaFlag) tipo = 'conta';
  else if (norm.some(w => w === 'entrada' || w === 'recebi' || w === 'receita')) tipo = 'entrada';
  else if (norm.some(w => w === 'debito')) tipo = 'debito';
  else if (norm.some(w => w === 'pix')) tipo = 'pix';
  else if (norm.some(w => w === 'conta')) tipo = 'conta';
  else if (norm.some(w => w === 'credito' || w === 'cartao')) tipo = 'cartao';

  const PALAVRAS_TIPO = new Set(['fixa','fixo','entrada','recebi','receita','debito','pix','conta','credito','cartao']);

  let valor = null, cartaoId = null, bancoId = null, contaId = null, data = null, diaFixa = null;
  const restantes = [];

  for (let i = 0; i < palavras.length; i++) {
    const p = palavras[i];
    const pNorm = norm[i];
    const pNum = pNorm.replace(',', '.');

    const matchData = p.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
    if (!data && matchData) {
      const hoje = new Date();
      let [_, dd, mm, aa] = matchData;
      let ano = aa ? (aa.length === 2 ? 2000 + parseInt(aa, 10) : parseInt(aa, 10)) : hoje.getFullYear();
      const d = new Date(ano, parseInt(mm, 10) - 1, parseInt(dd, 10));
      if (!isNaN(d.getTime())) { data = d.toISOString().slice(0, 10); continue; }
    }

    const matchDiaGrudado = pNorm.match(/^dia(\d{1,2})$/);
    if (!diaFixa && matchDiaGrudado) { diaFixa = parseInt(matchDiaGrudado[1], 10); continue; }
    if (!diaFixa && pNorm === 'dia' && palavras[i + 1] && /^\d{1,2}$/.test(palavras[i + 1])) {
      diaFixa = parseInt(palavras[i + 1], 10); i += 1; continue;
    }

    if (valor === null && /^\d+([.,]\d+)?$/.test(p)) { valor = parseFloat(pNum); continue; }
    if (PALAVRAS_TIPO.has(pNorm)) continue;

    if (!cartaoId && (tipo === null || tipo === 'cartao') && APELIDOS_CARTAO[pNorm]) {
      cartaoId = APELIDOS_CARTAO[pNorm]; continue;
    }
    restantes.push(p);
  }

  if (valor === null) return null;
  if (!tipo) tipo = 'cartao';

  const descricao = restantes.join(' ').trim() || (
    tipo === 'entrada' ? 'Entrada' : tipo === 'conta' ? 'Conta' : tipo === 'debito' ? 'Débito' : tipo === 'pix' ? 'Pix' : 'Gasto'
  );

  if (tipo === 'conta' && !fixaFlag && contasFixas && contasFixas.length) {
    const descNorm = normalizar(descricao);
    const match = contasFixas.find(c => descNorm.includes(normalizar(c.nome)) || normalizar(c.nome).includes(descNorm));
    if (match) contaId = match.id;
  }
  if (tipo === 'cartao' && !cartaoId) cartaoId = CARTOES[0].id;

  if ((tipo === 'debito' || tipo === 'pix' || tipo === 'entrada') && bancos && bancos.length) {
    const descNorm = normalizar(descricao);
    const matchBanco = bancos.find(b => descNorm.includes(normalizar(b.nome)) || normalizar(b.nome).includes(descNorm));
    bancoId = matchBanco ? matchBanco.id : bancos[0].id;
  }

  if (fixaFlag && !diaFixa && data) diaFixa = parseInt(data.slice(8, 10), 10);

  return { tipo, valor, descricao, cartaoId, contaId, bancoId, data, fixaFlag, diaFixa };
}

function App() {
  const [lancamentos, setLancamentos] = useState([]);
  const [contasFixas, setContasFixas] = useState([]);
  const [bancos, setBancos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [mesAtual, setMesAtual] = useState(new Date().getMonth());
  const [anoAtual, setAnoAtual] = useState(new Date().getFullYear());

  const [showForm, setShowForm] = useState(false);
  const [showContaForm, setShowContaForm] = useState(false);
  const [showBancoForm, setShowBancoForm] = useState(false);
  const [novaConta, setNovaConta] = useState({ nome: '', valor: '', dia: '' });
  const [novoBanco, setNovoBanco] = useState({ nome: '', saldoInicial: '' });
  const [textoRapido, setTextoRapido] = useState('');
  const [erroRapido, setErroRapido] = useState(false);

  const [form, setForm] = useState({
    tipo: 'cartao', descricao: '', valor: '', data: todayISO(),
    cartaoId: CARTOES[0].id, contaId: '', bancoId: '',
  });

  useEffect(() => {
    (async () => {
      try {
        const { data, error } = await supabaseClient.from('financas').select('dados').eq('id', 'principal').single();
        if (!error && data && data.dados) {
          setLancamentos(data.dados.lancamentos || []);
          setContasFixas(data.dados.contasFixas || []);
          setBancos(data.dados.bancos || []);
        }
      } catch (e) {
        console.error(e);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function salvar(next) {
    const novoLancamentos = next.lancamentos !== undefined ? next.lancamentos : lancamentos;
    const novoContasFixas = next.contasFixas !== undefined ? next.contasFixas : contasFixas;
    const novoBancos = next.bancos !== undefined ? next.bancos : bancos;
    setLancamentos(novoLancamentos);
    setContasFixas(novoContasFixas);
    setBancos(novoBancos);
    try {
      const { error } = await supabaseClient.from('financas').update({
        dados: { lancamentos: novoLancamentos, contasFixas: novoContasFixas, bancos: novoBancos },
        atualizado_em: new Date().toISOString(),
      }).eq('id', 'principal');
      setSaveError(!!error);
    } catch (e) {
      setSaveError(true);
    }
  }

  function addContaFixa(e) {
    e.preventDefault();
    const valorNum = parseFloat((novaConta.valor || '0').replace(',', '.'));
    const diaNum = parseInt(novaConta.dia, 10);
    if (!novaConta.nome || isNaN(diaNum) || diaNum < 1 || diaNum > 31) return;
    const nova = { id: Date.now().toString(), nome: novaConta.nome, valor: isNaN(valorNum) ? 0 : valorNum, dia: diaNum };
    salvar({ contasFixas: [...contasFixas, nova] });
    setNovaConta({ nome: '', valor: '', dia: '' });
    setShowContaForm(false);
  }
  function removerContaFixa(id) { salvar({ contasFixas: contasFixas.filter(c => c.id !== id) }); }

  function addBanco(e) {
    e.preventDefault();
    const saldoNum = parseFloat((novoBanco.saldoInicial || '0').replace(',', '.'));
    if (!novoBanco.nome) return;
    const novo = { id: Date.now().toString(), nome: novoBanco.nome, saldoInicial: isNaN(saldoNum) ? 0 : saldoNum };
    salvar({ bancos: [...bancos, novo] });
    setNovoBanco({ nome: '', saldoInicial: '' });
    setShowBancoForm(false);
  }
  function removerBanco(id) { salvar({ bancos: bancos.filter(b => b.id !== id) }); }

  function toggleContaPaga(conta, doMesAtual) {
    const existentes = doMesAtual.filter(l => l.tipo === 'conta' && l.contaId === conta.id).map(l => l.id);
    if (existentes.length > 0) {
      salvar({ lancamentos: lancamentos.filter(l => !existentes.includes(l.id)) });
    } else {
      const novo = { id: Date.now().toString(), tipo: 'conta', descricao: conta.nome, valor: conta.valor || 0, data: todayISO(), cartaoId: null, contaId: conta.id, bancoId: null };
      salvar({ lancamentos: [novo, ...lancamentos] });
    }
  }

  function addLancamento(e) {
    e.preventDefault();
    const valorNum = parseFloat(form.valor.replace(',', '.'));
    if (!form.descricao || isNaN(valorNum) || valorNum <= 0) return;
    const novo = {
      id: Date.now().toString(), tipo: form.tipo, descricao: form.descricao, valor: valorNum, data: form.data,
      cartaoId: form.tipo === 'cartao' ? form.cartaoId : null,
      contaId: form.tipo === 'conta' && form.contaId ? form.contaId : null,
      bancoId: (form.tipo === 'debito' || form.tipo === 'pix' || form.tipo === 'entrada') && form.bancoId ? form.bancoId : null,
    };
    salvar({ lancamentos: [novo, ...lancamentos] });
    setForm({ ...form, descricao: '', valor: '', contaId: '' });
    setShowForm(false);
  }
  function removerLancamento(id) { salvar({ lancamentos: lancamentos.filter(l => l.id !== id) }); }

  function enviarRapido(e) {
    e.preventDefault();
    const resultado = parseRapido(textoRapido, contasFixas, bancos);
    if (!resultado) { setErroRapido('valor'); return; }
    if (resultado.fixaFlag && !resultado.diaFixa) { setErroRapido('dia'); return; }

    let contaIdFinal = resultado.contaId;
    let contasFixasFinal = contasFixas;
    if (resultado.fixaFlag) {
      const descNorm = normalizar(resultado.descricao);
      const jaExiste = contasFixas.find(c => normalizar(c.nome) === descNorm);
      if (jaExiste) contaIdFinal = jaExiste.id;
      else {
        const novaContaFixa = { id: Date.now().toString() + 'f', nome: resultado.descricao, valor: resultado.valor, dia: resultado.diaFixa };
        contasFixasFinal = [...contasFixas, novaContaFixa];
        contaIdFinal = novaContaFixa.id;
      }
    }
    const novo = {
      id: Date.now().toString(), tipo: resultado.tipo, descricao: resultado.descricao, valor: resultado.valor,
      data: resultado.data || todayISO(), cartaoId: resultado.cartaoId, contaId: contaIdFinal, bancoId: resultado.bancoId,
    };
    salvar({ lancamentos: [novo, ...lancamentos], contasFixas: contasFixasFinal });
    setTextoRapido('');
    setErroRapido(false);
  }

  const doMes = useMemo(() => lancamentos.filter(l => {
    const d = new Date(l.data + 'T00:00:00');
    return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
  }), [lancamentos, mesAtual, anoAtual]);

  const totalEntradas = doMes.filter(l => l.tipo === 'entrada').reduce((s, l) => s + l.valor, 0);
  const totalContas = doMes.filter(l => l.tipo === 'conta').reduce((s, l) => s + l.valor, 0);
  const totalCartoes = doMes.filter(l => l.tipo === 'cartao').reduce((s, l) => s + l.valor, 0);
  const totalDebitoPix = doMes.filter(l => l.tipo === 'debito' || l.tipo === 'pix').reduce((s, l) => s + l.valor, 0);
  const saldo = totalEntradas - totalContas - totalCartoes - totalDebitoPix;

  const gastosPorCartao = CARTOES.map(c => ({ ...c, total: doMes.filter(l => l.tipo === 'cartao' && l.cartaoId === c.id).reduce((s, l) => s + l.valor, 0) }));
  const statusContasFixas = contasFixas.map(c => {
    const lancsDaConta = doMes.filter(l => l.tipo === 'conta' && l.contaId === c.id);
    return { ...c, pago: lancsDaConta.reduce((s, l) => s + l.valor, 0), paga: lancsDaConta.length > 0 };
  });
  const statusBancos = bancos.map(b => {
    const entradas = lancamentos.filter(l => l.tipo === 'entrada' && l.bancoId === b.id).reduce((s, l) => s + l.valor, 0);
    const saidas = lancamentos.filter(l => (l.tipo === 'debito' || l.tipo === 'pix') && l.bancoId === b.id).reduce((s, l) => s + l.valor, 0);
    return { ...b, saldoAtual: (b.saldoInicial || 0) + entradas - saidas };
  });

  function mudarMes(delta) {
    let m = mesAtual + delta, a = anoAtual;
    if (m < 0) { m = 11; a -= 1; } if (m > 11) { m = 0; a += 1; }
    setMesAtual(m); setAnoAtual(a);
  }

  if (loading) {
    return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#E7E2D3'}}>Carregando…</div>;
  }

  return (
    <div style={{minHeight:'100vh',paddingBottom:100}}>
      <div style={{padding:'28px 20px 16px',borderBottom:'1px solid #262922'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',maxWidth:720,margin:'0 auto'}}>
          <div>
            <div style={{fontSize:11,letterSpacing:2,color:'#7A8071',textTransform:'uppercase'}}>Livro-caixa</div>
            <h1 className="disp" style={{margin:'4px 0 0',fontSize:26,fontWeight:700}}>Controle financeiro</h1>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:16,marginTop:18}}>
          <button onClick={() => mudarMes(-1)} style={navBtnStyle}>‹</button>
          <div className="disp" style={{fontSize:15,minWidth:120,textAlign:'center',fontWeight:700}}>{MESES[mesAtual]} / {anoAtual}</div>
          <button onClick={() => mudarMes(1)} style={navBtnStyle}>›</button>
        </div>
      </div>

      <div style={{maxWidth:720,margin:'0 auto',padding:20}}>

        <form onSubmit={enviarRapido} style={{marginBottom:20}}>
          <div style={{display:'flex',gap:8}}>
            <input value={textoRapido} onChange={e => {setTextoRapido(e.target.value); setErroRapido(false);}}
              placeholder='Ex: bradesco 45,90 mercado' style={{...inputStyle, flex:1}} />
            <button type="submit" style={{background:'#7FB069',border:'none',color:'#12140F',borderRadius:8,padding:'0 16px',cursor:'pointer'}}>+</button>
          </div>
          {erroRapido === 'dia' ? (
            <div style={{fontSize:11,color:'#E08A7B',marginTop:6}}>Pra criar conta fixa, diga o dia do vencimento. Ex: "fixa 120 dia 10 internet".</div>
          ) : erroRapido ? (
            <div style={{fontSize:11,color:'#E08A7B',marginTop:6}}>Não entendi o valor — inclua um número.</div>
          ) : (
            <div style={{fontSize:11,color:'#6E7466',marginTop:6}}>Cartão, débito, pix, conta ou entrada + valor + descrição. "fixa" + "dia 10" cria conta fixa.</div>
          )}
        </form>

        {saveError && (
          <div style={{background:'#2A1B1B',border:'1px solid #5B3434',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#E08A7B',textAlign:'center',marginBottom:16}}>
            Não consegui salvar agora — confira a conexão com o Supabase.
          </div>
        )}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:22}}>
          <ResumoCard label="Entradas" valor={totalEntradas} cor="#7FB069" />
          <ResumoCard label="Contas+cartões+déb/pix" valor={totalContas+totalCartoes+totalDebitoPix} cor="#D9705A" />
          <div style={{gridColumn:'1 / -1',background:saldo>=0?'#1B2A1E':'#2A1B1B',border:`1px solid ${saldo>=0?'#345B3C':'#5B3434'}`,borderRadius:10,padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:12,color:'#A6ABA0',textTransform:'uppercase'}}>Saldo do mês</span>
            <span className="disp" style={{fontSize:20,fontWeight:700,color:saldo>=0?'#9ED08A':'#E08A7B'}}>{formatBRL(saldo)}</span>
          </div>
        </div>

        <SectionBlock title="Saldo em conta" onAdd={() => setShowBancoForm(true)} addLabel="nova conta bancária">
          {statusBancos.length === 0 ? <EmptyHint text='Nenhuma conta bancária cadastrada.' /> : (
            <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:6}}>
              {statusBancos.map(b => (
                <div key={b.id} style={{minWidth:168,borderRadius:12,padding:14,background:'#182430',border:'1px solid #26343F',flexShrink:0,position:'relative'}}>
                  <button onClick={() => removerBanco(b.id)} style={xBtnStyle}>×</button>
                  <div className="disp" style={{fontWeight:700,fontSize:14,marginBottom:10}}>{b.nome}</div>
                  <div style={{fontSize:11,color:'#8DA3B0',marginBottom:4,textTransform:'uppercase'}}>Saldo atual</div>
                  <div style={{fontSize:18,fontWeight:700,color:b.saldoAtual>=0?'#E7E2D3':'#E08A7B'}}>{formatBRL(b.saldoAtual)}</div>
                </div>
              ))}
            </div>
          )}
        </SectionBlock>

        <SectionBlock title="Cartões">
          <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:6}}>
            {gastosPorCartao.map(c => {
              const dias = diasParaVencimento(c.vencimento);
              return (
                <div key={c.id} style={{minWidth:168,borderRadius:12,padding:14,background:c.cor,color:c.texto,flexShrink:0}}>
                  <div style={{fontSize:12,opacity:0.85}}>Vence dia {c.vencimento}</div>
                  <div className="disp" style={{fontWeight:700,fontSize:14,margin:'4px 0 14px'}}>{c.nome}</div>
                  <div style={{fontSize:17,fontWeight:600}}>{formatBRL(c.total)}</div>
                  <div style={{marginTop:8,fontSize:11,display:'inline-block',padding:'2px 8px',borderRadius:20,background:dias<=5?'rgba(0,0,0,0.35)':'rgba(255,255,255,0.18)'}}>
                    {dias===0?'vence hoje':`${dias} dia${dias>1?'s':''} p/ vencer`}
                  </div>
                </div>
              );
            })}
          </div>
        </SectionBlock>

        <SectionBlock title="Contas fixas" onAdd={() => setShowContaForm(true)} addLabel="nova conta">
          {statusContasFixas.length === 0 ? <EmptyHint text='Nenhuma conta fixa cadastrada.' /> : (
            <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:6}}>
              {statusContasFixas.map(c => {
                const dias = diasParaVencimento(c.dia);
                return (
                  <div key={c.id} style={{minWidth:168,borderRadius:12,padding:14,background:'#1E2A1E',border:`1px solid ${c.paga?'#345B3C':'#262922'}`,flexShrink:0,position:'relative'}}>
                    <button onClick={() => removerContaFixa(c.id)} style={xBtnStyle}>×</button>
                    <button onClick={() => toggleContaPaga(c, doMes)} style={{position:'absolute',top:8,left:8,width:20,height:20,borderRadius:6,cursor:'pointer',border:`1.5px solid ${c.paga?'#7FB069':'#4A4F42'}`,background:c.paga?'#7FB069':'transparent',color:'#12140F',fontSize:12,lineHeight:'16px',padding:0}}>{c.paga?'✓':''}</button>
                    <div style={{fontSize:12,color:'#A6ABA0',textAlign:'right'}}>Vence dia {c.dia}</div>
                    <div className="disp" style={{fontWeight:700,fontSize:14,margin:'12px 0 14px'}}>{c.nome}</div>
                    <div style={{fontSize:17,fontWeight:600}}>{formatBRL(c.valor)}</div>
                    <div style={{marginTop:8,fontSize:11,display:'inline-block',padding:'2px 8px',borderRadius:20,background:c.paga?'rgba(127,176,105,0.2)':'rgba(255,255,255,0.08)',color:c.paga?'#9ED08A':'#A6ABA0'}}>
                      {c.paga?'paga este mês':(dias===0?'vence hoje':`${dias} dia${dias>1?'s':''} p/ vencer`)}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </SectionBlock>

        <div>
          <div className="disp" style={{fontSize:12,letterSpacing:1.5,textTransform:'uppercase',color:'#7A8071',marginBottom:10,fontWeight:700}}>Lançamentos do mês</div>
          {doMes.length === 0 ? <EmptyHint text='Nada lançado neste mês ainda.' /> : (
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {[...doMes].sort((a,b)=>b.data.localeCompare(a.data)).map(l => {
                const t = TIPOS[l.tipo] || TIPOS.conta;
                const cartao = l.cartaoId ? CARTOES.find(c=>c.id===l.cartaoId) : null;
                return (
                  <div key={l.id} style={{display:'flex',alignItems:'center',gap:10,background:'#181B15',border:'1px solid #262922',borderRadius:10,padding:'10px 12px'}}>
                    <div style={{width:8,height:8,borderRadius:99,background:t.cor,flexShrink:0}} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13.5,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{l.descricao}</div>
                      <div style={{fontSize:11,color:'#7A8071'}}>{new Date(l.data+'T00:00:00').toLocaleDateString('pt-BR')}{cartao?` · ${cartao.nome}`:''}</div>
                    </div>
                    <div className="disp" style={{fontWeight:700,fontSize:14,color:l.tipo==='entrada'?'#9ED08A':'#E08A7B'}}>{l.tipo==='entrada'?'+':'−'}{formatBRL(l.valor)}</div>
                    <button onClick={() => removerLancamento(l.id)} style={{background:'none',border:'none',color:'#6E7466',cursor:'pointer',fontSize:16}}>×</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <button onClick={() => setShowForm(true)} style={{position:'fixed',bottom:24,right:20,width:54,height:54,borderRadius:'50%',background:'#7FB069',border:'none',color:'#12140F',fontSize:26,cursor:'pointer',boxShadow:'0 6px 18px rgba(127,176,105,0.4)'}}>+</button>

      {showForm && (
        <Modal onClose={() => setShowForm(false)}>
          <form onSubmit={addLancamento}>
            <ModalHeader title="Novo lançamento" onClose={() => setShowForm(false)} />
            <div style={{display:'flex',gap:6,marginBottom:8}}>
              {['entrada','conta'].map(k => (
                <button type="button" key={k} onClick={() => setForm({...form, tipo:k})}
                  style={tipoBtnStyle(form.tipo===k, TIPOS[k].cor)}>{TIPOS[k].label}</button>
              ))}
              <button type="button" onClick={() => setForm({...form, tipo: GRUPO_GASTO.includes(form.tipo)?form.tipo:'cartao'})}
                style={tipoBtnStyle(GRUPO_GASTO.includes(form.tipo), '#D9705A')}>Gasto</button>
            </div>
            {GRUPO_GASTO.includes(form.tipo) && (
              <div style={{display:'flex',gap:6,marginBottom:14}}>
                {GRUPO_GASTO.map(k => (
                  <button type="button" key={k} onClick={() => setForm({...form, tipo:k})} style={tipoBtnStyle(form.tipo===k, TIPOS[k].cor)}>{TIPOS[k].label}</button>
                ))}
              </div>
            )}
            <label style={labelStyle}>Descrição</label>
            <input required value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} placeholder="Ex: Supermercado" style={inputStyle} />
            <div style={{display:'flex',gap:10}}>
              <div style={{flex:1}}><label style={labelStyle}>Valor (R$)</label>
                <input required value={form.valor} onChange={e=>setForm({...form,valor:e.target.value})} placeholder="0,00" inputMode="decimal" style={inputStyle} /></div>
              <div style={{flex:1}}><label style={labelStyle}>Data</label>
                <input required type="date" value={form.data} onChange={e=>setForm({...form,data:e.target.value})} style={inputStyle} /></div>
            </div>
            {form.tipo === 'cartao' && (<>
              <label style={labelStyle}>Cartão</label>
              <select value={form.cartaoId} onChange={e=>setForm({...form,cartaoId:e.target.value})} style={inputStyle}>
                {CARTOES.map(c => <option key={c.id} value={c.id}>{c.nome} (vence dia {c.vencimento})</option>)}
              </select></>)}
            {(form.tipo==='debito'||form.tipo==='pix'||form.tipo==='entrada') && bancos.length>0 && (<>
              <label style={labelStyle}>Conta bancária</label>
              <select value={form.bancoId} onChange={e=>setForm({...form,bancoId:e.target.value})} style={inputStyle}>
                <option value="">Selecione</option>
                {bancos.map(b => <option key={b.id} value={b.id}>{b.nome}</option>)}
              </select></>)}
            {form.tipo==='conta' && contasFixas.length>0 && (<>
              <label style={labelStyle}>Vincular a conta fixa (opcional)</label>
              <select value={form.contaId} onChange={e=>{
                const id=e.target.value; const conta=contasFixas.find(c=>c.id===id);
                setForm({...form, contaId:id, descricao: conta?conta.nome:form.descricao, valor: conta&&conta.valor?String(conta.valor):form.valor});
              }} style={inputStyle}>
                <option value="">Avulsa / outra</option>
                {contasFixas.map(c => <option key={c.id} value={c.id}>{c.nome} (vence dia {c.dia})</option>)}
              </select></>)}
            <button type="submit" style={submitBtnStyle('#7FB069')}>Salvar lançamento</button>
          </form>
        </Modal>
      )}

      {showContaForm && (
        <Modal onClose={() => setShowContaForm(false)}>
          <form onSubmit={addContaFixa}>
            <ModalHeader title="Nova conta fixa" onClose={() => setShowContaForm(false)} />
            <label style={labelStyle}>Nome</label>
            <input required value={novaConta.nome} onChange={e=>setNovaConta({...novaConta,nome:e.target.value})} placeholder="Ex: Aluguel, Internet" style={inputStyle} />
            <div style={{display:'flex',gap:10}}>
              <div style={{flex:1}}><label style={labelStyle}>Valor aprox. (R$)</label>
                <input value={novaConta.valor} onChange={e=>setNovaConta({...novaConta,valor:e.target.value})} placeholder="0,00" inputMode="decimal" style={inputStyle} /></div>
              <div style={{flex:1}}><label style={labelStyle}>Dia do vencimento</label>
                <input required type="number" min="1" max="31" value={novaConta.dia} onChange={e=>setNovaConta({...novaConta,dia:e.target.value})} placeholder="Ex: 5" style={inputStyle} /></div>
            </div>
            <button type="submit" style={submitBtnStyle('#E0A458')}>Salvar conta</button>
          </form>
        </Modal>
      )}

      {showBancoForm && (
        <Modal onClose={() => setShowBancoForm(false)}>
          <form onSubmit={addBanco}>
            <ModalHeader title="Nova conta bancária" onClose={() => setShowBancoForm(false)} />
            <label style={labelStyle}>Nome do banco</label>
            <input required value={novoBanco.nome} onChange={e=>setNovoBanco({...novoBanco,nome:e.target.value})} placeholder="Ex: Nubank, Itaú" style={inputStyle} />
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>
              {CARTOES.filter(c=>!bancos.some(b=>normalizar(b.nome)===normalizar(c.nome))).map(c => (
                <button type="button" key={c.id} onClick={()=>setNovoBanco({...novoBanco,nome:c.nome})} style={chipStyle}>+ {c.nome}</button>
              ))}
            </div>
            <label style={labelStyle}>Saldo atual (R$)</label>
            <input value={novoBanco.saldoInicial} onChange={e=>setNovoBanco({...novoBanco,saldoInicial:e.target.value})} placeholder="0,00" inputMode="decimal" style={inputStyle} />
            <button type="submit" style={submitBtnStyle('#5B9BD5')}>Salvar conta bancária</button>
          </form>
        </Modal>
      )}
    </div>
  );
}

function ResumoCard({label,valor,cor}) {
  return (
    <div style={{background:'#181B15',border:'1px solid #262922',borderRadius:10,padding:'12px 14px'}}>
      <div style={{fontSize:11,color:'#A6ABA0',textTransform:'uppercase',marginBottom:6}}>{label}</div>
      <div className="disp" style={{fontSize:17,fontWeight:700,color:cor}}>{formatBRL(valor)}</div>
    </div>
  );
}
function SectionBlock({title,onAdd,addLabel,children}) {
  return (
    <div style={{marginBottom:22}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div className="disp" style={{fontSize:12,letterSpacing:1.5,textTransform:'uppercase',color:'#7A8071',marginBottom:10,fontWeight:700}}>{title}</div>
        {onAdd && <button onClick={onAdd} style={{background:'none',border:'none',color:'#7FB069',fontSize:12,cursor:'pointer',marginBottom:10}}>+ {addLabel}</button>}
      </div>
      {children}
    </div>
  );
}
function EmptyHint({text}) {
  return <div style={{textAlign:'center',padding:'20px 10px',color:'#6E7466',fontSize:13,border:'1px dashed #262922',borderRadius:10}}>{text}</div>;
}
function Modal({onClose,children}) {
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'flex-end',zIndex:50}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#181B15',borderTopLeftRadius:18,borderTopRightRadius:18,padding:'20px 20px 28px',width:'100%',maxWidth:720,margin:'0 auto',border:'1px solid #262922',borderBottom:'none',maxHeight:'85vh',overflowY:'auto'}}>
        {children}
      </div>
    </div>
  );
}
function ModalHeader({title,onClose}) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
      <h2 className="disp" style={{margin:0,fontSize:17}}>{title}</h2>
      <button type="button" onClick={onClose} style={{background:'none',border:'none',color:'#A6ABA0',cursor:'pointer',fontSize:18}}>×</button>
    </div>
  );
}

const navBtnStyle = {background:'#181B15',border:'1px solid #262922',color:'#E7E2D3',width:32,height:32,borderRadius:8,fontSize:18,cursor:'pointer'};
const labelStyle = {display:'block',fontSize:11,color:'#7A8071',marginBottom:4,marginTop:10,textTransform:'uppercase'};
const inputStyle = {width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid #262922',background:'#12140F',color:'#E7E2D3',fontSize:14};
const xBtnStyle = {position:'absolute',top:8,right:8,background:'none',border:'none',color:'#6E7466',cursor:'pointer',fontSize:14};
const chipStyle = {fontSize:11,padding:'5px 10px',borderRadius:20,cursor:'pointer',border:'1px solid #262922',background:'transparent',color:'#7A8071'};
function tipoBtnStyle(ativo, cor) {
  return {flex:1,padding:'8px 4px',borderRadius:8,fontSize:12,cursor:'pointer',border:`1px solid ${ativo?cor:'#262922'}`,background:ativo?cor+'22':'transparent',color:ativo?cor:'#A6ABA0'};
}
function submitBtnStyle(cor) {
  return {marginTop:16,width:'100%',padding:13,borderRadius:10,border:'none',background:cor,color:'#12140F',fontWeight:700,fontSize:14,cursor:'pointer'};
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

} catch (e) {
  document.getElementById('root').innerHTML =
    '<div style="padding:20px;color:#E08A7B;font-family:monospace;white-space:pre-wrap;">Erro ao iniciar o app:\n' +
    (e && e.message ? e.message : String(e)) + '</div>';
}
</script>
</body>
</html>
